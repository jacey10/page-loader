<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jacey | Frontend Developer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ENTRY SCREEN -->
<div id="entryScreen" class="entry-screen">
  <button id="enterBtn">Enter Portfolio</button>
</div>

<!-- LOADER -->
<div id="loader" class="loader hidden">

  <div class="window">

    <div class="header">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
    </div>

    <div class="code-block">

      <div class="line">
        <span class="keyword">const</span>
        <span class="variable">dev</span>
        <span>= {</span>
      </div>

      <div class="line">
        &nbsp;&nbsp;name:
        <span class="value" data-value='"Jay Cee"'></span>,
      </div>

      <div class="line">
        &nbsp;&nbsp;role:
        <span class="value" data-value='"Frontend Developer"'></span>,
      </div>

      <div class="line">
        &nbsp;&nbsp;status:
        <span class="value" data-value='"Available for work"'></span>
      </div>

      <div class="line">}</div>

    </div>

    <div class="controls">
      <button id="skipBtn">Skip</button>
      <button id="replayBtn">Replay</button>
      <button id="soundBtn">Sound: On</button>
    </div>

  </div>

</div>

<!-- PORTFOLIO -->
<main id="portfolio" class="portfolio">
  <div class="container">
    <section class="hero">
      <h1>Nice to meet you,<br>I'm <span>Jacey</span>.</h1>
      <p>Frontend developer based in Nigeria. I build accessible, performant interfaces with HTML, CSS, and JavaScript.</p>
      <a href="#" class="btn">View Projects</a>
    </section>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
